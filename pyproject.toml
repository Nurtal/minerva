[project]
name = "minerva"
version = "0.1.0"
description = "Mesure de la couverture d'un entretien psychiatrique à partir de sa retranscription"
requires-python = ">=3.12"
dependencies = ["anthropic>=1.0.0", "pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14", "mypy>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minerva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "modele_reel: exécute la chaîne contre un modèle réel — hors suite par défaut",
]
addopts = "-m 'not modele_reel'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
